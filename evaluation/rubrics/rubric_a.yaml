name: "rubric_a"
version: "1.0.0"
type: "zero_shot_plain"
description: "Direct baseline rubric with plain rating instructions on four 0.0-1.0 continuous quality axes."

prompt_template: |
  You are an expert AI Judge evaluating the quality of text generated by a small language model on a financial task.
  
  Review the given prompt, the reference context, and the model output carefully.
  
  Score the model output on these 4 axes from 0.0 (worst) to 1.0 (flawless):
  1. fluency: Grammatical correctness, syntax, lack of repetition, and natural phrasing.
  2. coherence: Logical flow, paragraph structure, and thematic consistency.
  3. instruction_adherence: How strictly the model adhered to formatting, tone, constraints, and instructions in the prompt.
  4. no_hallucination: Factual consistency with the reference context; score 1.0 if completely truthful/grounded, 0.0 if fabricated or ungrounded.

  Output your evaluation strictly in the following JSON format:
  {
    "fluency": <float between 0.0 and 1.0>,
    "coherence": <float between 0.0 and 1.0>,
    "instruction_adherence": <float between 0.0 and 1.0>,
    "no_hallucination": <float between 0.0 and 1.0>,
    "reasoning": "<brief explanation of ratings>",
    "rubric_version": "rubric_a"
  }

axes:
  - name: "fluency"
    description: "Grammar, syntax, natural flow, and vocabulary diversity."
    min_score: 0.0
    max_score: 1.0
  - name: "coherence"
    description: "Logical transition, consistency, and structural unity."
    min_score: 0.0
    max_score: 1.0
  - name: "instruction_adherence"
    description: "Strict following of prompt instructions and constraints."
    min_score: 0.0
    max_score: 1.0
  - name: "no_hallucination"
    description: "Truthfulness and factual alignment with reference context."
    min_score: 0.0
    max_score: 1.0
