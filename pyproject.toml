[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgellm"
version = "0.2.0"
description = "Industrial-grade LLM Judge Reliability Toolkit: Audit, Route, and Bias Detection"
authors = [{ name = "Ankit Ghosh" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0",
    "groq>=0.9.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "pypdf2>=3.0.0",
]

[project.scripts]
judgellm = "judgellm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["judgellm*", "evaluation*", "analysis*"]
